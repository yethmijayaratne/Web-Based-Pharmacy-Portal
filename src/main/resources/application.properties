# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PharmacySystem;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=2004

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Disable foreign key constraints during schema update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts.action=update

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session settings
server.servlet.session.timeout=30m
spring.session.timeout=30m